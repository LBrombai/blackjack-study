<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Blackjack</title>
  <link rel="stylesheet" href="./src/css/style.css">

</head>
<body>


  <main id="game">

   <h1>Blackjack</h1>

   <!--Dealer-->
   <section id="dealer">
     <h2>Dealer <span id="dealer-points">0</span></h2>
     <div id="dealer-cards" class="cards"></div>
    </section>



    <!--Jogador-->
   <section id="player">
     <div id="player-cards" class="cards"></div>
     <h2>Jogador <span id="player-points">0</span></h2>
   </section>

    <!--Controles-->
   <section id="controls">
     <button id="hit">Pedir carta</button>
     <button id="stand">Parar</button>
     <button id="restart">Reiniciar</button>
   </section>

   <!--Message-->
    <p id="message"></p>

  </main>  


  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
